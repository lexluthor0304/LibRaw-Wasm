name: Sync Upstream

# Automatically sync this fork with upstream (ybouane/LibRaw-Wasm).
# Runs weekly + manual trigger. Fast-forward merges are pushed directly;
# conflicting merges open a PR for manual resolution.

on:
  schedule:
    # Every Monday at 03:17 UTC (off-peak, avoids :00/:30 thundering herd)
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write  # push merged changes
  pull-requests: write  # create PR on conflict

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # full history for merge

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote
        run: git remote add upstream https://github.com/ybouane/LibRaw-Wasm.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Check if behind upstream
        id: check
        run: |
          BEHIND=$(git rev-list --count main..upstream/main)
          echo "commits_behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date with upstream — nothing to do."
          else
            echo "$BEHIND upstream commit(s) to sync."
          fi

      - name: Attempt fast-forward merge
        id: merge
        if: steps.check.outputs.commits_behind != '0'
        continue-on-error: true
        run: |
          git merge upstream/main --ff-only
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Push fast-forward
        if: steps.merge.outputs.merged == 'true'
        run: git push origin main

      - name: Attempt non-ff merge (with conflict detection)
        id: merge3
        if: steps.merge.outcome == 'failure'
        continue-on-error: true
        run: |
          git merge upstream/main --no-edit
          echo "merged3=true" >> "$GITHUB_OUTPUT"

      - name: Push non-ff merge
        if: steps.merge3.outputs.merged3 == 'true'
        run: git push origin main

      - name: Create PR for conflicted merge
        if: steps.merge3.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const upstreamHead = await github.rest.git.getRef({
              owner: 'ybouane',
              repo: 'LibRaw-Wasm',
              ref: 'heads/main',
            });
            const upstreamSha = upstreamHead.data.object.sha;

            // Create a branch pointing at upstream main
            const branchName = `sync/upstream-${new Date().toISOString().slice(0, 10)}`;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${branchName}`,
              sha: upstreamSha,
            });

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⬆️ Sync upstream (conflicts need resolution)`,
              head: branchName,
              base: 'main',
              body: [
                'Upstream has new commits that conflict with this fork.',
                '',
                '**Next steps:**',
                '1. Check out this branch locally',
                '2. `git merge origin/main` and resolve conflicts',
                '3. Push the resolution and merge this PR',
                '',
                '🤖 Generated by [sync-upstream workflow](https://github.com/${{ github.repository }}/actions/workflows/sync-upstream.yml).',
              ].join('\n'),
            });
            console.log(`Created PR #${pr.number}: ${pr.html_url}`);
